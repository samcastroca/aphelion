[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aphelion"]

[project]
name = "aphelion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "mapbox-vector-tile>=2.2.0",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pysbd>=0.3.4",
    "pytesseract>=0.3.13",
    "sentence-transformers>=5.6.1",
    # Directa, no heredada de transformers: la fragmentación tokeniza por el
    # backend Rust para no cargar torch en cada worker del pool.
    "tokenizers>=0.22.2",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

# torch no aparece arriba a propósito: entra igual como dependencia de
# sentence-transformers, y declararlo en la base impediría que el extra `cuda`
# lo resuelva desde otro índice.

[project.optional-dependencies]
# Codificación por GPU en Radeon (RDNA2 y posteriores) bajo Windows, vía el
# ejecutor DirectML de ONNX Runtime. No es una dependencia base: en una máquina
# con NVIDIA sobra, y `optimum` no se usa porque su resolución de dependencias
# entra en conflicto con transformers 5.x.
#     uv sync --extra amd
#
# `onnx` no es redundante con `onnxruntime-directml`: el primero es el formato y
# el segundo el motor, y no se arrastran entre sí. Hace falta para exportar el
# modelo la primera vez —`torch.onnx.export` lo importa al final, después de
# haber trazado la red entera— y sin él la corrida muere con "Module onnx is not
# installed!" tras un minuto de trabajo tirado.
amd = ["onnx>=1.20", "onnxruntime-directml>=1.24"]

# Grafo de conocimiento (§7, bonus). Es un extra y no una dependencia base porque
# el componente es opcional y la pasada de NER solo se corre en la máquina que
# construye la entrega.
#     uv sync --extra grafo
#
# `gliner2[local]` es el paquete oficial de Fastino y es el que usa el backend por
# defecto: coloca el modelo en la GPU e infiere por lotes. `gliner2-onnx` no hace
# ninguna de las dos cosas —solo `extract_entities(text, labels)`, y con la sesión
# en CPU salvo que se le pase el proveedor—, que es de donde salían las 15 horas
# de la primera versión de esta etapa; se conserva porque es el único camino a
# DirectML en la Radeon.
#
# El conflicto que dejó fuera a `gliner` v1 —declara `transformers<5.14.0` contra
# el `>=5.14.1` de este proyecto, el mismo choque que ya excluyó a `optimum`— no
# aplica a `gliner2`: pide `torch` y `transformers` sin tope de versión.
#
# Licencias: los paquetes son MIT/Apache-2.0 y el modelo
# (`fastino/gliner2-multi-v1`, con su export ONNX) Apache-2.0, que es lo que pide
# la §4.3.
#
# networkx llega igualmente como dependencia de torch, pero aquí se importa
# directo —`aphelion.grafo.construccion`— y una dependencia que se usa se declara.
grafo = ["gliner2[local]>=1.3.2", "gliner2-onnx>=0.1.1", "networkx>=3.0"]

# Codificación por GPU en NVIDIA. Las ruedas de PyPI para Windows son solo CPU,
# así que la build con CUDA hay que pedirla al índice de PyTorch.
#     uv sync --extra cuda
cuda = ["torch>=2.13.0"]

# El par opuesto de `cuda`. Existe para que el lock guarde las dos procedencias
# de torch: sin él, uv unifica la resolución y todas las máquinas —incluida la
# Radeon— acabarían bajando los ~3 GB de ruedas CUDA.
cpu = ["torch>=2.13.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
# Instalar torch a mano con `uv pip install --index-url ...` no funciona: el
# siguiente `uv run` sincroniza contra el lock, ve una versión que no es la
# fijada y reinstala encima la rueda CPU de PyPI. La procedencia tiene que estar
# en el lock, y esto es lo que la pone ahí.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# cu130 y no cu128: el canal cu128 se quedó en torch 2.11 y este proyecto exige
# 2.13. Blackwell (sm_120) queda cubierto igual, la condición real era CUDA
# >= 12.8. `explicit` mantiene el índice restringido a torch: el resto de
# paquetes sigue viniendo de PyPI.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
