[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aphelion"]

[project]
name = "aphelion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "lxml>=6.1.1",
    "mapbox-vector-tile>=2.2.0",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pysbd>=0.3.4",
    "pytesseract>=0.3.13",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
# Codificación por GPU en Radeon (RDNA2 y posteriores) bajo Windows, vía el
# ejecutor DirectML de ONNX Runtime. No es una dependencia base: en una máquina
# con NVIDIA sobra, y `optimum` no se usa porque su resolución de dependencias
# entra en conflicto con transformers 5.x.
#     uv sync --extra amd
amd = ["onnxruntime-directml>=1.24"]
